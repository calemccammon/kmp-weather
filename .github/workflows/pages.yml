name: Deploy to GitHub Pages

# Runs only when started by hand from the Actions tab. GitHub Pages needs a
# public repository on the free plan; until then this workflow will fail at
# the "Configure Pages" step. Once it works, add a push trigger on main to
# deploy on every merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The Wasm build. For the JS build use :webApp:jsBrowserDistribution and
      # webApp/build/dist/js/productionExecutable.
      - run: ./gradlew :webApp:wasmJsBrowserDistribution
      # Serve the app for unknown paths too, so deep links survive a reload.
      - run: cp webApp/build/dist/wasmJs/productionExecutable/index.html webApp/build/dist/wasmJs/productionExecutable/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
