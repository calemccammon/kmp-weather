name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test shared code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # iOS tests need a macOS runner and are left out.
      - run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest

  build:
    name: Build Android APK and desktop app
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :androidApp:assembleDebug :desktopApp:assemble
      - uses: actions/upload-artifact@v7
        with:
          name: kmp-weather-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
