name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # ktlint: formatting and style. detekt: code smells. lintDebug: Android Lint.
      - run: ./gradlew ktlintCheck detekt :androidApp:lintDebug --continue
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
          retention-days: 14

  check:
    name: Test shared code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The domain and data tests run on every platform that can run here:
      # the JVM (with the UI's tests, which draw it on the desktop), Android
      # and the browser. iOS tests need a macOS runner, so the iOS code is
      # only compiled.
      - run: >
          ./gradlew :shared:jvmTest :shared:testAndroidHostTest :shared:jsTest
          :shared:compileKotlinIosSimulatorArm64

  build:
    name: Build Android APK, desktop and web apps
    needs: [lint, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The desktop app needs Java 25, which Gradle fetches for itself.
      - run: ./gradlew :androidApp:assembleDebug :desktopApp:assemble :webApp:jsBrowserDistribution
      - uses: actions/upload-artifact@v7
        with:
          name: kmp-weather-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: kmp-weather-web
          path: webApp/build/dist/js/productionExecutable
          retention-days: 14
