# Overrides on top of detekt's default rule set.
# All rules: https://detekt.dev/docs/rules/comments

naming:
  MatchingDeclarationName:
    # Dependencies.android.kt, Dependencies.ios.kt and so on hold the actuals of Dependencies.kt.
    multiplatformTargets: ['android', 'ios', 'jvm', 'js']
  FunctionNaming:
    # Composable functions are named like classes.
    ignoreAnnotated: ['Composable']
    # The iOS entry point is a function named like the UIKit class it returns.
    # Tests are named as sentences, in backticks.
    excludes: ['**/MainViewController.kt', '**/*Test/**']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    # Sizes and colours in Compose UI code and its previews.
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/*Test/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

complexity:
  LongParameterList:
    # Composables take many parameters by design.
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
